<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1B4332;
    overflow: hidden;
  }
  #marco {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  #carga {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #1B4332;
    color: #E8DCC8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    transition: opacity .35s ease;
    z-index: 5;
  }
  #carga.oculto {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(232,220,200,.35);
    border-top-color: #E8DCC8;
    border-radius: 50%;
    animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  #carga p { margin: 0; font-size: 14px; opacity: .9; }
  #alternativa {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12.5px;
    color: rgba(232,220,200,.75);
    text-align: center;
    opacity: 0;
    transition: opacity .4s ease;
    z-index: 4;
  }
  #alternativa.visible { opacity: 1; }
  #alternativa a { color: #E8DCC8; }
</style>
</head>
<body>

  <iframe id="marco" title="Barbería El Corte — Panel de administración" allow="clipboard-write"></iframe>

  <div id="carga">
    <div class="spinner"></div>
    <p>Cargando el panel…</p>
  </div>

  <p id="alternativa">
    ¿No carga? <a id="linkDirecto" href="#" target="_top">Ábrelo directo acá</a>
  </p>

  <script>
    document.getElementById('linkDirecto').href = EXEC_URL;

    var marco = document.getElementById('marco');
    var carga = document.getElementById('carga');
    var alternativa = document.getElementById('alternativa');

    marco.addEventListener('load', function () {
      carga.classList.add('oculto');
    });

    marco.src = EXEC_URL;

    setTimeout(function () {
      if (!carga.classList.contains('oculto')) alternativa.classList.add('visible');
    }, 8000);
  </script>

</body>
</html>
